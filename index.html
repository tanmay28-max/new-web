<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Login ❤️</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="stars"></div>
    <div class="login-container">
        <div class="lock-icon">🔒</div>
        <h2>Enter Our Special Date</h2>
        <p>(Hint: DDMMYYYY)</p>
        <input type="password" id="password" placeholder="Password..." maxlength="8">
        <button id="loginBtn">Unlock ❤️</button>
        <p id="error-msg" class="hidden">Oops! Wrong date. Try again! 🥺</p>
    </div>
        <script src="js/login.js"></script>
</body>
</html>
