<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise!</title>
    <style>
        body {
            background-color: #1a1a2e; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            overflow: hidden;
            position: relative; /* Floating hearts er jonno */
        }

        /* Floating Hearts Design */
        #heart-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Jate video click e osubidha na hoy */
            z-index: 0;
            overflow: hidden;
        }
        .floating-heart {
            position: absolute;
            bottom: -50px;
            font-size: 60px;
            animation: floatUp linear infinite;
            opacity: 0.7;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8); opacity: 0.8; }
            100% { transform: translateY(-120vh) scale(1.2); opacity: 0; }
        }

        #surprise-btn {
            padding: 15px 40px;
            font-size: 40px;
            font-weight: bold;
            background: linear-gradient(45deg, #ff4757, #ff6b81);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(255, 71, 87, 0.3);
            z-index: 10;
        }
        #magic-box {
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 10; /* Background er opore thakbe */
        }
        #magic-video {
            width: 280px;
            opacity: 0; 
            border-radius: 15px;
            transition: opacity 2s ease-in; 
            box-shadow: 0 0 20px rgba(255, 159, 243, 0.2);
        }
        #magic-text {
            color: #ff9ff3;
            margin-top: 20px;
            font-size: 28px;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 2s ease-in, transform 2s ease-out;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        #next-btn {
            margin-top: 30px;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(45deg, #0984e3, #74b9ff);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            opacity: 0;
            display: none; 
            transition: opacity 1s ease-in;
            box-shadow: 0 8px 15px rgba(9, 132, 227, 0.3);
        }

        #magic-video.video-show { opacity: 1; }
        #magic-text.text-show { opacity: 1; transform: translateY(0); }
        #next-btn.btn-show { opacity: 1; }
    </style>
</head>
<body>

    <!-- Background Hearts Container -->
    <div id="heart-container"></div>

    <button id="surprise-btn">Surprise! 🎁</button>
    
    <div id="magic-box">
        <video id="magic-video" src="video.mp4" playsinline muted autoplay loop></video>
        <h2 id="magic-text">Only for you my cutie ❤️</h2>
        
        <button id="next-btn">Next Surprise ➔</button>
    </div>

    <script>
        // Floating hearts toiri korar logic
        function createHeart() {
            const hearts = ["💖", "🫀", "💝"];
            const heart = document.createElement('div');
            heart.classList.add('floating-heart');
            heart.innerText = hearts[Math.floor(Math.random() * hearts.length)];
            
            // Random position ar speed
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = (Math.random() * 3 + 4) + "s"; 
            
            document.getElementById('heart-container').appendChild(heart);
            
            // Screen theke beriye gele delete kore dewa hobe jate phone hang na kore
            setTimeout(() => {
                heart.remove();
            }, 7000);
        }

        const btn = document.getElementById('surprise-btn');
        const magicBox = document.getElementById('magic-box');
        const magicVideo = document.getElementById('magic-video');
        const magicText = document.getElementById('magic-text');
        const nextBtn = document.getElementById('next-btn');
        let heartInterval;

        btn.addEventListener('click', () => {
            btn.style.display = 'none'; 
            magicBox.style.display = 'flex'; 
            
            // Magic button e click korlei background e hearts ora shuru hobe
            heartInterval = setInterval(createHeart, 400); // 400ms por por notun heart
            
            setTimeout(() => { 
                magicVideo.classList.add('video-show'); 
                magicVideo.play(); 
            }, 100);
            
            setTimeout(() => { 
                magicText.classList.add('text-show'); 
            }, 4000);
            
            // Next Surprise button thik 21 second (21000 ms) por asbe
            setTimeout(() => {
                nextBtn.style.display = 'block';
                setTimeout(() => { nextBtn.classList.add('btn-show'); }, 50);
            }, 21000); 
        });

        nextBtn.addEventListener('click', () => {
            window.location.href = "wish.html"; 
        });
    </script>
</body>
</html>
