<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch the Hearts 💖</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/game.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div class="stars"></div>
    <div class="game-ui">
        <h2>Catch 10 Hearts! 💖</h2>
        <h3>Score: <span id="score">0</span></h3>
    </div>
    
    <div id="game-area">
        <div id="tray">🧺</div>
    </div>
    
    <!-- ফাইনাল মেসেজ এবং ক্যালেন্ডার সেকশন -->
    <div id="final-message" class="hidden">
        
        <div id="win-section">
            <h1>You Won My Heart! 🥰</h1>
            <p>Happy Birthday once again! Keep smiling always.</p>
            
            <div class="date-picker-container">
                <p>Fix your birthday party date: 🍕</p>
                <input type="date" id="partyDate" class="cute-date-input">
                <br>
                <button id="submitDateBtn" class="submit-btn">Submit 💌</button>
            </div>
        </div>

        <div id="goodbye-message" class="hidden">
            <h1 class="huge-text">Happy Birthday Tanmay! Have a good day! ❤️</h1>
        </div>

    </div>
    
    <script src="js/game.js"></script>
</body>
</html>
