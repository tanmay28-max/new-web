<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wish For You ❤️</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .letter-card { background: rgba(255,255,255,0.9); color: #333; padding: 40px; border-radius: 15px; max-width: 500px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { color: #ff416c; font-family: 'Dancing Script', cursive; font-size: 2.5rem; margin-bottom: 20px;}
        #typewriter { font-size: 1.2rem; min-height: 100px; font-weight: 600; line-height: 1.6;}
        .next-btn { display: none; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="stars"></div>
    <div class="letter-card">
        <h1>Happy Birthday NISHA 🎂</h1>
        <p id="typewriter"></p>
        <button id="nextBtn" class="next-btn" onclick="window.location.href='party.html'">Next Surprise 🎁</button>
    </div>

    <script>
        const text = "Wishing you a day filled with happiness and a year filled with joy. You are the most special person in my life! I love you so much. ❤️";
        let i = 0;
        function typeWriter() {
            if (i < text.length) {
                document.getElementById("typewriter").innerHTML += text.charAt(i);
                i++;
                setTimeout(typeWriter, 50);
            } else {
                document.getElementById("nextBtn").style.display = "inline-block";
            }
        }
        window.onload = typeWriter;
    </script>
</body>
</html>
